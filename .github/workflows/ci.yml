name: CLI checks
on:
  push:
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python 3.11 python -m unittest discover -s tests -v
      - run: uv run --python 3.11 wellbore --help
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: wellbore-cli-${{ matrix.os }}
          path: dist/*
