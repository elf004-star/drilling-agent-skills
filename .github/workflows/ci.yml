name: CLI checks
on:
  push:
    # Filtering on branches rather than tags-ignore: defining only tag filters
    # makes GitHub skip branch pushes entirely, which silently disables CI.
    # Tags are not branches, so "v*" tag pushes are excluded by this filter.
    branches: ["**"]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python 3.11 python -m unittest discover -s tests -v
      - run: uv run --python 3.11 wellbore --help
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: wellbore-cli-${{ matrix.os }}
          path: dist/*
